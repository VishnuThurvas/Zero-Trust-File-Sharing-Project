spring.application.name=secure-file-sharing
spring.datasource.url=jdbc:h2:file:./data/secureshare;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=secureshare2024
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=./uploads
app.jwt.secret=ZeroTrustSecureFileSharingPlatform2024VeryLongSecretKeyForHMACSHA512Algorithm
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.security.max-login-attempts=5
app.security.lockout-duration-minutes=15
server.port=8080
server.error.include-message=always
